<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打谱工具 · 星际节拍</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0a0f1e;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    color:#dff6ff;-webkit-tap-highlight-color:transparent;
  }
  #app{
    height:100%;display:flex;flex-direction:column;
    padding:18px;gap:12px;max-width:900px;margin:0 auto;
  }
  h1{
    font-size:18px;letter-spacing:4px;text-align:center;
    color:#7ff5ff;text-shadow:0 0 20px rgba(93,240,255,.5);font-weight:800;
  }

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}

  /* 文件选择区域 */
  .fileRow{
    display:flex;gap:10px;align-items:center;justify-content:center;
    flex-wrap:wrap;padding:12px;border-radius:12px;
    background:rgba(20,40,80,.4);border:1px dashed rgba(90,180,255,.35);
  }
  .fileRow label{
    font-size:13px;color:rgba(150,200,255,.7);letter-spacing:1px;
  }
  .fileRow input[type=file]{
    display:none;
  }
  .fileRow .fileLabel{
    padding:9px 18px;border-radius:10px;cursor:pointer;
    background:rgba(60,130,200,.4);color:#dff6ff;
    border:1px solid rgba(120,220,255,.4);
    font-size:13px;letter-spacing:1px;font-weight:700;
    transition:all .15s;
  }
  .fileRow .fileLabel:hover{
    background:rgba(90,180,240,.7);color:#fff;
    box-shadow:0 0 16px rgba(93,240,255,.4);
  }
  .fileRow .fileName{
    font-size:12px;color:#7ff5ff;max-width:200px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  button,select{
    padding:10px 18px;border-radius:10px;
    border:1px solid rgba(120,220,255,.35);
    background:rgba(40,80,140,.4);color:#dff6ff;
    font-size:13.5px;font-family:inherit;cursor:pointer;
    letter-spacing:1px;transition:all .15s;
  }
  button:hover,select:hover{
    background:rgba(80,150,220,.6);
    border-color:rgba(150,240,255,.7);color:#fff;
  }
  button:active{transform:scale(.97);}
  button.primary{
    background:linear-gradient(135deg,#6ff3ff,#2f8bff);
    color:#03202e;border:none;font-weight:700;
  }
  button.primary:hover{box-shadow:0 0 20px rgba(93,240,255,.6);}
  button.danger{
    background:rgba(255,100,100,.2);
    border-color:rgba(255,140,140,.5);color:#ffc4c4;
  }
  button.danger:hover{background:rgba(255,140,140,.4);color:#fff;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  .display{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:rgba(20,40,80,.4);
    border:1px solid rgba(90,180,255,.25);border-radius:20px;
    padding:22px 20px;position:relative;
  }
  .timeBig{
    font-size:clamp(42px,8vw,76px);font-weight:800;
    letter-spacing:3px;color:#5df0ff;
    text-shadow:0 0 40px rgba(93,240,255,.8);
    font-variant-numeric:tabular-nums;line-height:1;
    transition:transform .08s;
  }
  .hintBig{
    font-size:12px;letter-spacing:2px;
    color:rgba(150,200,255,.55);text-align:center;line-height:1.7;
  }
  .hintBig b{color:#5df0ff;}
  .progressBar{
    width:100%;height:4px;background:rgba(30,60,110,.6);
    border-radius:2px;overflow:hidden;margin-top:6px;
  }
  .progressBar .bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,#5df0ff,#2f8bff);
    transition:width .08s linear;
  }
  .stats{
    display:flex;justify-content:space-between;width:100%;
    font-size:12px;color:rgba(150,200,255,.7);
    margin-top:8px;letter-spacing:1px;font-variant-numeric:tabular-nums;
  }

  .timesList{
    flex:1;min-height:100px;
    background:rgba(10,20,40,.6);
    border:1px solid rgba(90,180,255,.2);border-radius:14px;
    padding:12px;overflow-y:auto;
    font-family:'SF Mono',Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.7;color:#a8d8ff;
  }
  .timesList::-webkit-scrollbar{width:8px;}
  .timesList::-webkit-scrollbar-thumb{
    background:rgba(90,180,255,.3);border-radius:4px;
  }
  .timesList .empty{
    color:rgba(150,200,255,.35);text-align:center;
    padding:24px 0;font-family:inherit;letter-spacing:2px;
    font-size:13px;
  }
  .timesList .row{
    display:flex;justify-content:space-between;
    padding:2px 8px;border-radius:4px;
  }
  .timesList .row:nth-child(odd){background:rgba(40,80,140,.15);}
  .timesList .idx{color:rgba(150,200,255,.45);min-width:50px;}
  .timesList .val{color:#7ff5ff;}

  .actions{
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  }

  #toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    background:rgba(30,80,130,.92);
    border:1px solid rgba(120,220,255,.5);
    padding:10px 22px;border-radius:20px;
    font-size:13px;letter-spacing:1.5px;
    opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:10;
    max-width:90vw;text-align:center;
  }
  #toast.on{opacity:1;}

  @media (max-width:520px){
    #app{padding:12px;gap:9px;}
    h1{font-size:14px;letter-spacing:2px;}
    button,select{padding:8px 13px;font-size:12.5px;}
    .display{padding:16px 14px;border-radius:16px;}
    .timeBig{font-size:42px;}
    .hintBig{font-size:10.5px;}
    .stats{font-size:10.5px;}
    .fileRow{padding:10px;}
    .fileRow label{font-size:11.5px;}
    .fileRow .fileLabel{padding:7px 14px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="app">
  <h1>打 谱 工 具</h1>

  <!-- 文件选择区 -->
  <div class="fileRow">
    <label>音频：</label>
    <label class="fileLabel" for="audioFile">选择音频文件</label>
    <input type="file" id="audioFile" accept="audio/*">
    <span class="fileName" id="audioName">未选择</span>
  </div>

  <!-- 播放控制 -->
  <div class="row">
    <button id="playBtn" class="primary" disabled>▶ 播放</button>
    <button id="backBtn" disabled>« 3s</button>
    <button id="fwdBtn" disabled>3s »</button>
    <button id="resetBtn" disabled>↺ 回到开头</button>
    <label style="font-size:12px;display:flex;align-items:center;gap:5px;">
      音量<input type="range" id="volSlider" min="0" max="100" value="100" style="width:70px;">
    </label>
  </div>

  <!-- 时间显示 -->
  <div class="display">
    <div class="timeBig" id="timeBig">00:00.000</div>
    <div class="hintBig">
      播放中按 <b>空格</b> 打点 · <b>退格</b> 撤销 · <b>← →</b> 快退/快进 3 秒
    </div>
    <div class="progressBar"><div class="bar" id="progressBar"></div></div>
    <div class="stats">
      <span id="statTime">0.000 s</span>
      <span id="statCount">已打点: 0</span>
    </div>
  </div>

  <!-- 打点列表 -->
  <div class="timesList" id="timesList">
    <div class="empty">还没有打点 · 选择音频后按播放开始</div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button id="undoBtn" disabled>↶ 撤销</button>
    <button id="clearBtn" class="danger" disabled>清空全部</button>
    <button id="copyBtn" class="primary" disabled>📋 复制时间戳</button>
    <button id="exportBtn" disabled>💾 导出 txt</button>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';

// ============ DOM ============
const audioFile = document.getElementById('audioFile');
const audioName = document.getElementById('audioName');
const playBtn = document.getElementById('playBtn');
const backBtn = document.getElementById('backBtn');
const fwdBtn = document.getElementById('fwdBtn');
const resetBtn = document.getElementById('resetBtn');
const volSlider = document.getElementById('volSlider');
const timeBig = document.getElementById('timeBig');
const progressBar = document.getElementById('progressBar');
const statTime = document.getElementById('statTime');
const statCount = document.getElementById('statCount');
const timesList = document.getElementById('timesList');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');
const copyBtn = document.getElementById('copyBtn');
const exportBtn = document.getElementById('exportBtn');
const toastEl = document.getElementById('toast');

// ============ 音频 ============
const audio = new Audio();
audio.preload = 'auto';

// ============ 状态 ============
let times = [];
let isPlaying = false;
let duration = 0;
let hasAudio = false;
let toastTimer = null;

// ============ 工具 ============
function fmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return String(m).padStart(2, '0') + ':' +
    (s < 10 ? '0' : '') + s.toFixed(3);
}

function toast(msg, dur) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), dur || 1600);
}

// ============ UI 更新 ============
function updateUI() {
  const t = audio.currentTime || 0;
  timeBig.textContent = fmt(t);
  statTime.textContent = t.toFixed(3) + ' s';
  statCount.textContent = `已打点: ${times.length}`;
  if (duration > 0) {
    progressBar.style.width = Math.min(100, t / duration * 100) + '%';
  } else {
    progressBar.style.width = '0%';
  }
}

function updateButtons() {
  const canPlay = hasAudio;
  playBtn.disabled = !canPlay;
  backBtn.disabled = !canPlay;
  fwdBtn.disabled = !canPlay;
  resetBtn.disabled = !canPlay;
  undoBtn.disabled = times.length === 0;
  clearBtn.disabled = times.length === 0;
  copyBtn.disabled = times.length === 0;
  exportBtn.disabled = times.length === 0;
  playBtn.textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
}

function renderList() {
  if (times.length === 0) {
    timesList.innerHTML = '<div class="empty">还没有打点 · 播放后按空格开始</div>';
    return;
  }
  const html = times.map((t, i) =>
    `<div class="row"><span class="idx">#${String(i + 1).padStart(3, '0')}</span><span class="val">${t.toFixed(3)}</span></div>`
  ).join('');
  timesList.innerHTML = html;
  timesList.scrollTop = timesList.scrollHeight;
}

// ============ 文件加载 ============
audioFile.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  // 用 URL.createObjectURL，避免 file:// 跨域问题
  const url = URL.createObjectURL(file);
  audio.src = url;
  audioName.textContent = file.name;

  times = [];
  isPlaying = false;
  hasAudio = true;
  duration = 0;

  audio.load();
  renderList();
  updateUI();
  updateButtons();
  toast('已加载：' + file.name, 2000);
});

audio.addEventListener('loadedmetadata', () => {
  duration = audio.duration || 0;
  updateUI();
});

audio.addEventListener('play', () => {
  isPlaying = true;
  updateButtons();
});
audio.addEventListener('pause', () => {
  isPlaying = false;
  updateButtons();
});
audio.addEventListener('ended', () => {
  isPlaying = false;
  updateButtons();
  toast('播放结束');
});

// ============ 播放控制 ============
playBtn.addEventListener('click', () => {
  if (!hasAudio) return;
  if (isPlaying) {
    audio.pause();
  } else {
    audio.play().catch(err => {
      toast('播放失败：' + (err.message || '未知错误'), 2200);
    });
  }
});

backBtn.addEventListener('click', () => {
  if (!hasAudio) return;
  audio.currentTime = Math.max(0, audio.currentTime - 3);
  updateUI();
});

fwdBtn.addEventListener('click', () => {
  if (!hasAudio) return;
  audio.currentTime = Math.min(duration, audio.currentTime + 3);
  updateUI();
});

resetBtn.addEventListener('click', () => {
  if (!hasAudio) return;
  audio.pause();
  try { audio.currentTime = 0; } catch (e) {}
  updateUI();
  updateButtons();
  toast('已回到开头');
});

volSlider.addEventListener('input', () => {
  audio.volume = volSlider.value / 100;
});

// ============ 打点 ============
function record() {
  if (!isPlaying) {
    toast('先点击播放再打点');
    return;
  }
  const t = audio.currentTime;
  if (!isFinite(t) || t < 0) return;
  // 与上一个点太近则忽略
  if (times.length > 0 && t - times[times.length - 1] < 0.08) return;
  times.push(t);
  updateUI();
  renderList();
  updateButtons();
  // 视觉反馈
  timeBig.style.transform = 'scale(1.07)';
  setTimeout(() => { timeBig.style.transform = 'scale(1)'; }, 70);
}

function undo() {
  if (times.length === 0) { toast('没有可撤销的点'); return; }
  times.pop();
  updateUI();
  renderList();
  updateButtons();
}

function clearAll() {
  if (times.length === 0) return;
  if (!confirm(`确定清空 ${times.length} 个时间点？`)) return;
  times = [];
  updateUI();
  renderList();
  updateButtons();
  toast('已清空');
}

async function copyAll() {
  if (times.length === 0) { toast('还没有打点'); return; }
  const text = times.map(t => t.toFixed(3)).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    toast(`已复制 ${times.length} 个时间戳到剪贴板`, 2200);
  } catch (e) {
    // 退回到 prompt
    prompt('自动复制失败，请手动复制：', text);
  }
}

function exportTxt() {
  if (times.length === 0) { toast('还没有打点'); return; }
  const text = times.map(t => t.toFixed(3)).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'times.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出 times.txt');
}

// ============ 键盘 ============
window.addEventListener('keydown', e => {
  // 焦点在 input 上时不拦截
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (e.repeat) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
      document.activeElement.blur();
    }
    record();
    return;
  }
  if (e.key === 'Backspace') {
    e.preventDefault();
    undo();
    return;
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (hasAudio) {
      audio.currentTime = Math.max(0, audio.currentTime - 3);
      updateUI();
    }
    return;
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (hasAudio) {
      audio.currentTime = Math.min(duration, audio.currentTime + 3);
      updateUI();
    }
    return;
  }
});

// ============ 触摸（手机） ============
// 点击时间显示区域可以打点（手机上没键盘）
const displayEl = document.querySelector('.display');
displayEl.addEventListener('click', e => {
  if (!isPlaying) return;
  // 避免误触到时间数字以外的元素（这里整体都是显示区）
  record();
});

// ============ 主循环 ============
function tick() {
  if (isPlaying) updateUI();
  requestAnimationFrame(tick);
}

updateUI();
updateButtons();
tick();

})();
</script>
</body>
</html>
